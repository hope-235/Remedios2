name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Backup app code
        run: |
          cp -r lib lib_backup
          cp pubspec.yaml pubspec_backup.yaml

      - name: Generate Flutter project scaffold
        run: flutter create --platforms android --project-name remediosring .

      - name: Restore app code over generated defaults
        run: |
          rm -rf lib
          mv lib_backup lib
          mv pubspec_backup.yaml pubspec.yaml

      - name: Add Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\
              <uses-permission android:name="android.permission.VIBRATE"/>' "$MANIFEST"

      - name: Patch build.gradle.kts for desugaring
        run: |
          python3 << 'PYEOF'
          import re

          path = 'android/app/build.gradle.kts'
          with open(path, 'r') as f:
              content = f.read()

          # Enable core library desugaring inside compileOptions
          content = content.replace(
              'compileOptions {',
              'compileOptions {\n        isCoreLibraryDesugaringEnabled = true'
          )

          # Set minSdk to 21
          content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', content)

          # Enable multiDex
          content = content.replace(
              'defaultConfig {',
              'defaultConfig {\n        multiDexEnabled = true'
          )

          # Add desugaring dependency
          if 'dependencies {' in content:
              content = content.replace(
                  'dependencies {',
                  'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              )
          else:
              content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          with open(path, 'w') as f:
              f.write(content)

          print("build.gradle.kts patched successfully")
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remediosring-apk
          path: build/app/outputs/flutter-apk/app-release.apk
